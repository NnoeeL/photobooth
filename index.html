<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Pop Wave Photobooth</title>
    <meta name="description" content="Fun K-Pop themed photobooth with multiple frame designs - take photos and get a stylish photo strip!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Fredoka:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated background particles -->
    <div class="bg-particles" id="bgParticles"></div>

    <!-- Main App Container -->
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">📸</span>
                <h1>K-POP <span class="wave-text">WAVE</span> Booth</h1>
            </div>
            <p class="subtitle">Choose a frame, take photos & download your strip!</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Panel - Camera -->
            <section class="camera-panel" id="cameraPanel">
                <div class="camera-wrapper">
                    <video id="webcam" autoplay playsinline></video>
                    <canvas id="snapshotCanvas" style="display:none;"></canvas>

                    <!-- Countdown overlay -->
                    <div class="countdown-overlay" id="countdownOverlay">
                        <span class="countdown-number" id="countdownNumber">3</span>
                    </div>

                    <!-- Flash effect -->
                    <div class="flash-overlay" id="flashOverlay"></div>

                    <!-- Camera frame corners -->
                    <div class="camera-corner tl"></div>
                    <div class="camera-corner tr"></div>
                    <div class="camera-corner bl"></div>
                    <div class="camera-corner br"></div>
                </div>

                <!-- Controls -->
                <div class="controls">
                    <button class="btn-capture" id="btnCapture" disabled>
                        <span class="btn-inner">
                            <span class="camera-icon">📷</span>
                            <span class="btn-text">Take Photo</span>
                        </span>
                    </button>
                    <div class="photo-counter">
                        <span id="photoCount">0</span> / <span id="photoTotal">4</span> photos
                    </div>
                </div>

                <!-- Filter Selection -->
                <div class="filter-bar">
                    <span class="filter-label">Filter:</span>
                    <button class="filter-btn active" data-filter="none">Normal</button>
                    <button class="filter-btn" data-filter="grayscale(100%)">B&W</button>
                    <button class="filter-btn" data-filter="sepia(80%)">Vintage</button>
                    <button class="filter-btn" data-filter="saturate(1.8) contrast(1.1)">Vivid</button>
                    <button class="filter-btn" data-filter="brightness(1.1) contrast(1.2) saturate(1.3)">Glow</button>
                </div>

                <!-- Timer Selection -->
                <div class="timer-bar">
                    <span class="timer-label">Timer:</span>
                    <button class="timer-btn active" data-timer="3">3s</button>
                    <button class="timer-btn" data-timer="5">5s</button>
                    <button class="timer-btn" data-timer="10">10s</button>
                </div>
            </section>

            <!-- Right Panel - Frame Selector & Strip Preview -->
            <section class="strip-panel" id="stripPanel">
                <!-- Frame Selector -->
                <div class="frame-selector">
                    <h3 class="frame-selector-title">🖼️ Choose Frame</h3>
                    <div class="frame-options" id="frameOptions">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Strip Preview -->
                <div class="strip-preview-wrapper">
                    <div class="strip-container" id="stripContainer">
                        <!-- Populated by JS based on selected frame -->
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="strip-actions">
                    <button class="btn-download" id="btnDownload" disabled>
                        <span>⬇️ Download Strip</span>
                    </button>
                    <button class="btn-reset" id="btnReset">
                        <span>🔄 Reset</span>
                    </button>
                </div>
            </section>
        </main>
    </div>

    <!-- Hidden canvas for final strip rendering -->
    <canvas id="finalCanvas" style="display:none;"></canvas>

    <script src="app.js"></script>
</body>
</html>
